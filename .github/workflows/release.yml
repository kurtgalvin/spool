# On a version tag (v0.0.3), builds the hook for every platform, packages one .vsix holding
# all of them, and attaches it to a GitHub Release. The Intel Mac hook is cross-compiled on the
# Apple silicon runner (macos-latest is arm64).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  hook:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, platform: darwin-x64 }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --manifest-path hook/Cargo.toml
      - run: cargo build --release --manifest-path hook/Cargo.toml --target ${{ matrix.target }}
      - run: |
          mkdir -p bin/${{ matrix.platform }}
          cp hook/target/${{ matrix.target }}/release/spool-hook bin/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v4
        with:
          name: hook-${{ matrix.platform }}
          path: bin/${{ matrix.platform }}/spool-hook

  package:
    needs: hook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          pattern: hook-*
          path: artifacts
      - name: Put each hook in bin/<platform>/
        run: |
          for dir in artifacts/hook-*; do
            platform=${dir#artifacts/hook-}
            mkdir -p bin/$platform
            cp $dir/spool-hook bin/$platform/
            chmod +x bin/$platform/spool-hook
          done
          ls -l bin/*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run package
      - run: gh release create "$GITHUB_REF_NAME" spool.vsix --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
